<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype POG 3D</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; overflow:hidden; font-family: Inter, system-ui, sans-serif; background:#10131a; }
    #app { position:relative; width:100%; height:100%; }
    #hud { position:absolute; inset:0; pointer-events:none; }
    #topBar, #bottomBar { position:absolute; left:0; right:0; display:flex; justify-content:space-between; padding:16px; font-weight:700; }
    #topBar { top:0; }
    #bottomBar { bottom:0; }
    .pog-strip { display:flex; gap:6px; }
    .pog-chip { width:14px; height:14px; border-radius:50%; border:1px solid #fff8; }
    #centerPanel { position:absolute; inset:0; display:grid; place-items:center; }
    #startBtn { pointer-events:auto; font-size:1.2rem; padding:12px 20px; border:none; border-radius:12px; background:#4caf50; color:white; cursor:pointer; }
    #message { position:absolute; top:56px; left:50%; transform:translateX(-50%); background:#000a; padding:8px 12px; border-radius:8px; font-size:.95rem; }
    #minigame { position:absolute; left:50%; transform:translateX(-50%); top:90px; width:min(540px,90vw); height:62px; pointer-events:none; display:none; }
    #targetTrack, #powerTrack { position:relative; width:100%; height:20px; border-radius:12px; border:2px solid #fff6; overflow:hidden; background:#111; }
    #targetDot { position:absolute; top:0; width:20px; height:20px; border-radius:50%; background:#3ec1ff; }
    #powerNeedle { position:absolute; top:0; width:6px; height:20px; background:white; }
    #powerHint { margin-top:8px; font-size:.82rem; text-align:center; }
    #scoreBoard { position:absolute; inset:0; display:none; place-items:center; background:#000c; }
    #scoreCard { background:#1c2230; padding:24px; border-radius:14px; width:min(420px,90vw); }
  </style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="topBar"><div>Adversaire: <span id="enemyScore">0</span></div><div class="pog-strip" id="enemyPogs"></div></div>
    <div id="message">Prêt pour une partie de POG.</div>
    <div id="minigame">
      <div id="targetTrack"><div id="targetDot"></div></div>
      <div id="powerTrack" style="margin-top:8px"></div>
      <div id="powerHint">Espace: verrouiller la cible puis la puissance.</div>
    </div>
    <div id="centerPanel"><button id="startBtn">Commencer</button></div>
    <div id="bottomBar"><div>Vous: <span id="playerScore">0</span></div><div class="pog-strip" id="playerPogs"></div></div>
    <div id="scoreBoard"><div id="scoreCard"><h2>Partie terminée</h2><p id="finalScore"></p><button id="restartBtn">Rejouer</button></div></div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
